version: 1
teams:
  mac-engineering:
    mode: implementation
    members:
      - agent: mac-implement
        duties: [implementation, lead]
      - agent: mac-review
        duties: [plan_review, initial_review, verification]
      - agent: mac-test
        duties: [unit_test]
  turbo-high:
    mode: implementation
    members:
      # implementation owns the production change; lead owns coordination and task accountability.
      # The lead duty is optional, never an approval duty, and never mandatory in a preset.
      - agent: senior-dev-engineer
        duties: [implementation, lead]
      # Own the plan review and the Luna initial review.
      # Can cover implementation (which cascades the review duties to terra-general) and verification.
      - agent: deepseek-pair-navigator
        duties: [plan_review, initial_review]
        can_cover: [implementation, verification]
      # Own the Terra initial review and the single verification.
      # The implementation owner never holds an approval duty.
      - agent: deepseek-evaluator
        duties: [initial_review, verification]
        can_cover: [plan_review]
      # Unit-test contributor. A contributor duty, not an approval duty: it takes test work from
      # the owner's split and works during the implementation stage only.
      - agent: luna-test-engineer
        duties: [unit_test]
  smoke-test:
    mode: smoke-test
    members:
      - agent: smoke-luna
        duties: [implementation]
      - agent: smoke-luna
        duties: [plan_review, initial_review]
      - agent: smoke-luna
        duties: [verification]
  observability:
    mode: implementation
    # Team work location. Profiles and this preset stay in this project's .pi/; the agents run here.
    workdir: /Users/dev-machine/dev/Observability
    members:
      - agent: obs-lead
        duties: [implementation, lead]
      - agent: obs-explorer
        duties: [plan_review, initial_review]
        can_cover: [verification]
      - agent: obs-verifier
        duties: [initial_review, verification]
        can_cover: [plan_review]
      - agent: obs-tester
        duties: [unit_test]
      - agent: obs-visual-reviewer
        duties: [initial_review]
