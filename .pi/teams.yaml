version: 1
teams:
  mac-engineering:
    mode: implementation
    members:
      - agent: mac-implementer
        duties: [implementation, lead]
      - agent: mac-worker-luna
        duties: []
      - agent: mac-plan-review
        duties: [plan_review]
      - agent: mac-test-terra
        duties: [unit_test]
      - agent: mac-review
        duties: [initial_review, verification]
  mac-engineering-complex:
    mode: implementation
    members:
      - agent: mac-implementer
        duties: [implementation, lead]
      - agent: mac-plan-review
        duties: [plan_review, verification]
      - agent: mac-test-terra
        duties: [unit_test]
      - agent: mac-review
        duties: [initial_review, verification]
  codex-budget:
    mode: implementation
    # Documentation remains a separate assignment for an existing Luna xhigh worker;
    # this preset does not auto-launch documentation work.
    # Add the separate pair-escalation Terra high reviewer only when escalation is required;
    # it is not a permanent member of this preset.
    members:
      - agent: mac-implementer
        duties: [implementation, lead]
      - agent: mac-plan-review
        duties: [plan_review, verification]
      - agent: codex-review-luna
        duties: [initial_review, verification]
      - agent: luna-test-engineer
        duties: [unit_test]
  smoke-test:
    mode: smoke-test
    members:
      - agent: smoke-luna
        duties: [implementation]
      - agent: smoke-luna
        duties: [plan_review, initial_review]
      - agent: smoke-luna
        duties: [verification]
  turbo-openai-high:
    mode: implementation
    # Main (Astra) is outside this roster for final review and acceptance.
    # A separate escalation owner is added only when needed.
    # The unit-test contributor never approves its own work.
    members:
      - agent: senior-dev-engineer
        duties: [implementation, lead]
      - agent: mac-plan-review
        duties: [plan_review]
      - agent: terra-high-review
        duties: [initial_review, verification]
      - agent: codex-review-luna
        duties: [verification]
      - agent: luna-test-engineer
        duties: [unit_test]
